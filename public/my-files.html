  <div class="page-wrapper">

    <div id="alertArea"></div>

    <main class="main-area">
      <!-- Loading State: Reverse Origami Paper Jet bringing files home -->
      <div id="loadingState" class="upload-card labdrop-upload-workbench">
        <h2 class="upload-workbench-title">Loading Saved Files…</h2>

        <!-- Clean Flight Corridor (Reverse Direction) -->
        <div class="origami-runway-corridor reverse-runway">
          <div class="runway-flight-line"></div>

          <!-- Reverse Paper Jet Glider (Flying Right-to-Left, Facing Left) -->
          <div class="paper-jet-glider reverse-glider">
            <svg width="86" height="42" viewBox="0 0 86 42" class="origami-jet-svg">
              <!-- Trail Draft Streams -->
              <g class="jet-trail-draft">
                <path d="M 14 8 C 4 9, -8 11, -22 13" stroke="#FFD166" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" class="draft-line draft-1" />
                <path d="M 18 23 C 8 24, -4 26, -18 29" stroke="#E5BB5A" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round" class="draft-line draft-2" />
                <circle cx="-6" cy="10" r="1.5" fill="#F59E0B" class="jet-sparkle sp-1" />
                <circle cx="-16" cy="13" r="1.2" fill="#FFD166" class="jet-sparkle sp-2" />
              </g>

              <!-- Origami Paper Jet Body -->
              <g class="jet-origami-body">
                <!-- Far Wing -->
                <polygon points="76,21 24,6 36,21" fill="#EAE6DE" stroke="#2C2C2C" stroke-width="1.1" stroke-linejoin="round" />
                
                <!-- Fuselage Keel Underbody -->
                <polygon points="76,21 18,25 30,30" fill="#D8D3C8" stroke="#2C2C2C" stroke-width="1.1" stroke-linejoin="round" />
                <polygon points="76,21 30,30 20,23" fill="#C9C3B6" stroke="#2C2C2C" stroke-width="0.9" stroke-linejoin="round" />

                <!-- Near Main Wing -->
                <polygon points="76,21 14,8 34,21" fill="#FDFBF7" stroke="#2C2C2C" stroke-width="1.2" stroke-linejoin="round" />

                <!-- Signature LabDrop Gold Wing Trim -->
                <polygon points="14,8 24,10.5 34,21" fill="#FFD166" stroke="#2C2C2C" stroke-width="1" stroke-linejoin="round" opacity="0.95" />
                
                <!-- Center Spine Fold Ridge -->
                <line x1="76" y1="21" x2="20" y2="21" stroke="#2C2C2C" stroke-width="1.3" stroke-linecap="round" />

                <!-- Nose Cone Gold Tip -->
                <polygon points="76,21 64,18 64,24" fill="#E5BB5A" stroke="#2C2C2C" stroke-width="1" stroke-linejoin="round" />
              </g>
            </svg>
          </div>
        </div>

        <!-- Reverse Progress Track -->
        <div class="progress-bar labdrop-progress-track">
          <div class="progress-bar__fill labdrop-progress-fill reverse-fill"></div>
        </div>

        <p class="upload-pct-label">Retrieving files from storage…</p>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="section--hidden upload-card">
        <div style="font-size: 3rem; margin-bottom: var(--space-md);">📂</div>
        <h2 style="margin-bottom: var(--space-sm);">No saved files found.</h2>
        <p style="color: var(--color-text-secondary); margin-bottom: var(--space-lg);">You haven't saved any files for later, or they have expired.</p>
        <a href="/" class="btn btn--primary">Create a Transfer</a>
      </div>

      <!-- Transfers List -->
      <div id="transfersContainer" class="section--hidden" style="display: flex; flex-direction: column; gap: var(--space-md);">
        <!-- Transfers injected here -->
      </div>
