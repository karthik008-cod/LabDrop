<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Lab Files — LabDrop</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/labdroplogo.png" />
  <meta name="theme-color" content="#FDFBF7" />
</head>
<body>

  <!-- Background Decorative Objects -->
  <div class="decorations">
    <svg class="dec-item dec-compass" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M50 20 L30 90 M50 20 L70 90 M36 70 L64 70" />
      <circle cx="50" cy="15" r="5" />
      <path d="M48 10 L52 10 M50 5 L50 10" />
    </svg>
    <svg class="dec-item dec-flask" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M40 20 L40 45 L15 85 A 5 5 0 0 0 20 95 L80 95 A 5 5 0 0 0 85 85 L60 45 L60 20 Z" />
      <path d="M35 20 L65 20 M30 70 L70 70 M25 80 L40 80 M75 80 L60 80" />
    </svg>
    <svg class="dec-item dec-ruler" viewBox="0 0 200 50" fill="none" stroke="currentColor" stroke-width="1.5" style="top:auto; bottom: 5%; right: 5%; transform: rotate(-10deg);">
      <rect x="5" y="10" width="190" height="30" rx="2" />
      <path d="M15 10 V20 M35 10 V15 M55 10 V20 M75 10 V15 M95 10 V20 M115 10 V15 M135 10 V20 M155 10 V15 M175 10 V20" />
      <circle cx="185" cy="25" r="3" />
    </svg>
    <div class="dec-item dec-formula dec-f1">E = mc²</div>
  </div>

  <!-- Header -->
    <header class="header">
  <div class="header__container">
      <a href="/" class="header__brand" style="text-decoration: none; color: inherit;">
        <img class="brand__logo" src="/labdroplogo.png" alt="LabDrop Logo" style="height: 40px; width: auto;" />
        <div class="brand__text">
          <h1 id="mHeaderTitle">LabDrop</h1>
          <p id="mHeaderSubtitle">Move files. Anywhere.</p>
        </div>
      </a>
      
      <!-- Auth Navigation -->
      <nav class="header__nav" id="authNav">
        <div id="authLoggedOut" style="display: flex; gap: var(--space-md);">
            <a href="/" class="nav-link" style="text-decoration: none;">Home</a>
          <button class="nav-link" id="navLoginBtn" style="background:none;border:none;cursor:pointer;">Login</button>
          <button class="nav-link" id="navSignupBtn" style="background:none;border:none;cursor:pointer;">Sign Up</button>
        </div>
        <div id="authLoggedIn" style="display: none; gap: var(--space-md); align-items: center;">
            <a href="/" class="nav-link" style="text-decoration: none;">Home</a>
          <a href="/my-files.html" class="nav-link">
            <span>🗄️</span> Saved Transfers
          </a>
          <div class="nav-icon" title="User Account" style="background: var(--color-bg-secondary); color: var(--color-text);">👤</div>
          <button class="nav-link" id="navLogoutBtn" style="background:none;border:none;cursor:pointer;color:var(--color-text-secondary);">Logout</button>
          <span id="navUserEmail" style="display:none;"></span>
        </div>
      </nav>
      </div>
</header>
  <div class="page-wrapper">

    <div id="alertArea"></div>

    <main class="main-area">
      <!-- Loading State -->
      <div id="loadingState" class="upload-card">
        <div style="font-size: 1.5rem; font-weight: 600; display: flex; align-items: center; justify-content: center;">
          <span class="spinner"></span> Loading your files…
        </div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="section--hidden upload-card">
        <div style="font-size: 3rem; margin-bottom: var(--space-md);">📂</div>
        <h2 style="margin-bottom: var(--space-sm);">No saved files found.</h2>
        <p style="color: var(--color-text-secondary); margin-bottom: var(--space-lg);">You haven't saved any files for later, or they have expired.</p>
        <a href="/" class="btn btn--primary">Create a Transfer</a>
      </div>

      <!-- Transfers List -->
      <div id="transfersContainer" class="section--hidden" style="display: flex; flex-direction: column; gap: var(--space-md);">
        <!-- Transfers injected here -->
      </div>
    </main>


    </div>

  <!-- Footer -->
    <footer class="footer" style="margin-top: auto; padding-top: var(--space-2xl); padding-bottom: var(--space-md); text-align: right; color: var(--color-text-muted); font-size: 0.85rem;">
      <div style="display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap;">
        <a href="/how-to-use.html" class="nav-link" style="color: var(--color-primary-dark); text-decoration: none; font-weight: bold;">How to Use</a>
        <a href="mailto:yuvaankaarthikeyaa.1206@gmail.com" class="nav-link" style="color: var(--color-primary-dark); text-decoration: none;">Email</a>
        <a href="https://www.linkedin.com/in/yuvaan-kaarthikeyaa-adulapuram-6ba90133b" target="_blank" class="nav-link" style="color: var(--color-primary-dark); text-decoration: none;">LinkedIn</a>
        <a href="https://github.com/karthik008-cod" target="_blank" class="nav-link" style="color: var(--color-primary-dark); text-decoration: none;">GitHub</a>
      </div>
      <div style="margin-top: 6px;">&copy; 2026 Yuvaan Kaarthikeyaa Adulapuram</div>
    </footer>

  <div id="toastContainer" class="toast-container"></div>
  <script src="/js/dialogs.js"></script>
  <script src="/js/bg.js"></script>
  <script src="/js/my-files.js"></script>
  
</body>
</html>
