<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabDrop — Your Files</title>
  <meta name="description" content="Download your lab files transferred via LabDrop." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>" />
</head>
<body>

  <div class="app-container">

    <!-- Loading State -->
    <div id="loadingState" class="loading-state">
      <div class="spinner" style="width: 36px; height: 36px; border-width: 3px;"></div>
      <div class="loading-state__text">Loading your files…</div>
    </div>

    <!-- Error State -->
    <div id="errorState" class="section section--hidden">
      <div class="error-page">
        <div class="error-page__icon" id="errorIcon">😕</div>
        <h1 class="error-page__title" id="errorTitle">Something went wrong</h1>
        <p class="error-page__message" id="errorMessage">Please try again.</p>
        <div style="margin-top: var(--space-xl);">
          <button class="btn btn--secondary" id="retryBtn" type="button">🔄 Retry</button>
        </div>
      </div>
    </div>

    <!-- PIN Entry State -->
    <div id="pinState" class="section section--hidden">
      <div class="card" style="margin-top: var(--space-2xl); text-align: center;">
        <div style="font-size: 3rem; margin-bottom: var(--space-md);">🔒</div>
        <h2 style="margin-bottom: var(--space-sm);">Protected Transfer</h2>
        <p style="color: var(--color-text-secondary); margin-bottom: var(--space-lg); font-size: var(--font-size-sm);">Please enter the 6-digit PIN to access these files.</p>
        <form id="pinForm" style="display: flex; flex-direction: column; gap: var(--space-md);">
          <input type="text" id="pinInput" placeholder="Enter PIN" maxlength="6" pattern="[0-9]*" inputmode="numeric" style="width: 100%; padding: 12px; font-size: 1.5rem; text-align: center; letter-spacing: 4px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: rgba(0,0,0,0.3); color: white; outline: none;" required />
          <button type="submit" class="btn btn--primary btn--lg" id="pinSubmitBtn">Unlock Files</button>
        </form>
        <div id="pinError" style="color: var(--color-error); font-size: var(--font-size-sm); margin-top: var(--space-md); display: none;"></div>
      </div>
    </div>

    <!-- Transfer View -->
    <div id="transferView" class="section section--hidden">

      <!-- Header -->
      <header class="mobile-header">
        <h1 class="mobile-header__title" id="mHeaderTitle">🧪 LabDrop</h1>
        <p class="mobile-header__subtitle" id="mHeaderSubtitle">Your lab files are ready</p>
      </header>

      <!-- Stats Card -->
      <div class="card">
        <div class="stats">
          <div class="stat">
            <div class="stat__value" id="mStatFiles">0</div>
            <div class="stat__label">Files</div>
          </div>
          <div class="stat">
            <div class="stat__value" id="mStatSize">0 B</div>
            <div class="stat__label">Total Size</div>
          </div>
          <div class="stat">
            <div class="stat__value" id="mStatExpiry">--:--</div>
            <div class="stat__label">Expires In</div>
          </div>
        </div>

        <!-- Download All -->
        <div class="download-btn-wrapper" style="display: flex; gap: 8px;">
          <a class="btn btn--success btn--lg" id="downloadAllBtn" href="#" style="flex: 1; padding: 1rem 1rem;">
            ⬇️ Download All (ZIP)
          </a>
          <button class="btn btn--secondary btn--icon" id="renameZipBtn" title="Rename ZIP" style="padding: 0 16px;">✏️</button>
        </div>
      </div>

      <!-- File & Link List -->
      <div class="card" style="margin-top: var(--space-lg);">
        <div class="card__title"><span>📎</span> Items</div>
        <ul class="file-list" id="mFileList"></ul>
        <ul class="file-list" id="mLinkList" style="margin-top: var(--space-md); border-top: 1px solid var(--color-border); padding-top: var(--space-md); display: none;"></ul>
      </div>

      <!-- Footer -->
      <footer class="footer">
        LabDrop · No login. No USB. No hassle.
      </footer>
    </div>

  </div>

  <script src="/js/mobile.js"></script>
</body>
</html>
